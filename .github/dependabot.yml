# Dependabot — automated dependency PRs.
#
# Each PR goes through the same mabl SDLC pipeline (lint → unit →
# build → newman → mabl smoke), so a Dependabot PR is functionally
# indistinguishable from a human PR — same gates, same checks, same
# auto-merge eligibility once tests pass.

version: 2
updates:
  # Production app deps
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Package-family groups — must move together for peer-dep / version-skew
      # reasons. These catch both minor/patch AND major bumps for the listed
      # packages so a major upgrade of e.g. `vitest` doesn't strand its peer
      # `@vitest/coverage-v8`.
      next-and-react:
        patterns:
          - "next"
          - "react"
          - "react-*"
          - "@types/react*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react*"
      vitest:
        # vitest and its companion packages must move together; without
        # this group, Dependabot bumps @vitest/coverage-v8 alone and the
        # peer-dep constraint (`peer vitest@<exact>`) breaks `npm ci`.
        # See PR #55 (closed 2026-05-12) for the failure pattern.
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@vitejs/plugin-react"
      # Catch-all for major bumps of packages NOT covered by the family
      # groups above (e.g. `eslint`, `typescript`, `eslint-config-next`).
      # First-matching-group-wins ordering means this only catches what
      # the families above don't. Per TAMD-105: major bumps need careful
      # human review for breaking changes, so we bundle them into a single
      # PR per cadence instead of 1 PR per major-leap dep.
      major-bumps:
        patterns:
          - "*"
        update-types:
          - "version-update:semver-major"


  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      # Same major-bumps strategy for action versions (e.g. actions/checkout
      # going v4 → v5 needs careful human review).
      major-bumps:
        patterns:
          - "*"
        update-types:
          - "version-update:semver-major"
