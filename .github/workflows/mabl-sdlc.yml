name: mabl SDLC gate

# Strict sequential gates + unified Slack + Jira notifications.
# Each stage's `needs:` gates the next; any failure skips downstream
# and emits a red Slack/Jira notification.
#
#   PR push   → lint → unit → build → t1-smoke-preview (newman CLI)
#               → mabl-smoke (CSH-SMOKE-PR, Preview)
#
#   Main push → lint → unit → build → t1-smoke-prod (newman CLI)
#               → post-deploy-smoke (CSH-SMOKE-POSTDEPLOY, Prod)
#
# Plan architecture (mabl workspace):
#   - CSH-SMOKE-PR           : labels type-smk,exec-pr,...   env=Preview only
#   - CSH-SMOKE-POSTDEPLOY   : labels type-smk,exec-postdeploy,...  env=Prod only
#
# Notifications (scripts/ci-notify.sh at each gate, both success & failure):
#   - Slack: rich message to $SLACK_WEBHOOK_URL (if set)
#   - Jira:  comment on the ticket referenced by branch name (e.g. TAMD-82/...)
#
# Required secrets:
#   - MABL_API_TOKEN, MABL_WORKSPACE_ID, MABL_APPLICATION_ID,
#     MABL_ENV_PREVIEW_ID, MABL_ENV_PROD_ID
# Optional secrets (notifications skip silently if unset):
#   - SLACK_WEBHOOK_URL
#   - JIRA_USER_EMAIL
#   - JIRA_API_TOKEN

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PRODUCTION_URL: https://cheap-shot-hockey.vercel.app
  # Notification env — read by scripts/ci-notify.sh
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: C0A321B477Y
  JIRA_BASE_URL: https://mabl.atlassian.net
  JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_TITLE: ${{ github.event.pull_request.title }}
  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  PROD_URL: https://cheap-shot-hockey.vercel.app

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stage 0: change detector — single source of truth for "what kind
  # of changes are in this PR?" Emits boolean flags consumed by every
  # expensive downstream job. See scripts/pipeline-awareness/
  # detect-changes.sh and docs/REFERENCE-ARCHITECTURE.md.
  #
  # Spec: TAMD-132.
  # ─────────────────────────────────────────────────────────────────

  change-detector:
    name: change-detector
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_app_changes:       ${{ steps.detect.outputs.has_app_changes }}
      has_lib_changes:       ${{ steps.detect.outputs.has_lib_changes }}
      has_api_changes:       ${{ steps.detect.outputs.has_api_changes }}
      has_deps_changes:      ${{ steps.detect.outputs.has_deps_changes }}
      has_workflows_changes: ${{ steps.detect.outputs.has_workflows_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: detect changes
        id: detect
        run: |
          set -euo pipefail
          # workflow_dispatch (manual trigger) forces every flag true so
          # a full pipeline run is achievable on demand.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — forcing all flags to true."
            for flag in has_app_changes has_lib_changes has_api_changes has_deps_changes has_workflows_changes; do
              echo "${flag}=true" >> "$GITHUB_OUTPUT"
              echo "${flag}=true"
            done
            exit 0
          fi
          # PR event: diff against the PR base SHA. Push event: diff
          # against the parent commit (HEAD~1).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          bash scripts/pipeline-awareness/detect-changes.sh "$BASE" HEAD

  # ─────────────────────────────────────────────────────────────────
  # Stage 1: code quality (lint → unit → build)
  # ─────────────────────────────────────────────────────────────────

  lint:
    name: lint (eslint)
    needs: change-detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: tool-surface contract check
        # Static assertions on the agentic DoD surface — fails the lint
        # gate if anyone widens it beyond the hardened defaults, un-pins
        # the model, or removes the same-repo restriction. See
        # scripts/llm/check-tool-surface.mjs.
        run: npm run check:tool-surface

  # Required security gate — npm audit at high+critical only. Blocks
  # merge when high/critical vulnerabilities are found. Promoted from
  # advisory in 2026-05 once the tighten-gating audit landed.
  # CodeQL runs in a separate workflow (.github/workflows/codeql.yml).
  security:
    name: security (npm audit)
    needs: change-detector
    # Skip when no dependency files changed — npm audit only meaningful
    # against changes in package*.json. Skipped jobs report success to
    # branch protection (TAMD-132).
    if: needs.change-detector.outputs.has_deps_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: npm audit (production app, high+critical only)
        run: npm audit --audit-level=high

  unit:
    name: unit tests + coverage
    needs: [lint, change-detector]
    # Skip when no src/lib/** or vitest.config.ts changed — unit tests
    # are scoped to src/lib/**. Skipped jobs report success to branch
    # protection (TAMD-132).
    if: needs.change-detector.outputs.has_lib_changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      test_total: ${{ steps.metrics.outputs.test_total }}
      test_passed: ${{ steps.metrics.outputs.test_passed }}
      test_failed: ${{ steps.metrics.outputs.test_failed }}
      coverage_lines: ${{ steps.metrics.outputs.coverage_lines }}
      coverage_branches: ${{ steps.metrics.outputs.coverage_branches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Vitest writes results JSON we can parse for counts; also produces
      # coverage-summary.json via the coverage config. Pipe full output to
      # a log so the metrics step can extract both.
      - name: unit tests + coverage
        id: tests
        run: |
          set +e
          npx vitest run --coverage --reporter=default --reporter=json --outputFile=vitest-results.json 2>&1 | tee vitest-output.log
          echo "unit_exit=$?" >> "$GITHUB_ENV"
          exit ${PIPESTATUS[0]}
      - name: extract test + coverage metrics
        id: metrics
        if: always()
        run: |
          # Test counts from the vitest JSON reporter
          if [ -f vitest-results.json ]; then
            total=$(jq '.numTotalTests // 0' vitest-results.json)
            passed=$(jq '.numPassedTests // 0' vitest-results.json)
            failed=$(jq '.numFailedTests // 0' vitest-results.json)
          else
            total=0; passed=0; failed=0
          fi
          # Coverage from v8's coverage-summary.json (.total.lines.pct, etc.)
          if [ -f coverage/coverage-summary.json ]; then
            cov_lines=$(jq -r '.total.lines.pct // "0"' coverage/coverage-summary.json)
            cov_branches=$(jq -r '.total.branches.pct // "0"' coverage/coverage-summary.json)
          else
            cov_lines=0; cov_branches=0
          fi
          echo "test_total=$total" >> "$GITHUB_OUTPUT"
          echo "test_passed=$passed" >> "$GITHUB_OUTPUT"
          echo "test_failed=$failed" >> "$GITHUB_OUTPUT"
          echo "coverage_lines=$cov_lines" >> "$GITHUB_OUTPUT"
          echo "coverage_branches=$cov_branches" >> "$GITHUB_OUTPUT"
          echo "unit: ${passed}/${total} passed · lines ${cov_lines}% · branches ${cov_branches}%"
      - name: upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: build (next)
    needs: [unit, change-detector]
    # Skip when no app-affecting paths changed (src/**, public/**, build
    # configs). Skipped jobs report success to branch protection (TAMD-132).
    #
    # TAMD-136: `!cancelled() && needs.unit.result != 'failure'` lets build
    # run when unit was *legitimately skipped* (e.g., Dependabot dep bump
    # touches only package-lock.json — has_app_changes=true but
    # has_lib_changes=false). Without this, the default success() rule
    # cascades skipped-upstream through the chain and every dep bump bypasses
    # build + type-check.
    if: |
      !cancelled() &&
      needs.unit.result != 'failure' &&
      needs.change-detector.outputs.has_app_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for git diff against main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: notify (Stage-1 code-quality passed)
        if: success() && github.event_name == 'pull_request'
        env:
          JIRA_TRANSITION: In Progress
          NEXT_GATE: "T1 — newman smoke (Preview)"
        run: |
          bash scripts/ci-notify.sh ok "Stage 1 · code quality" "Lint ok, unit tests green, build succeeded. Ticket moving to In Progress."

  # ─────────────────────────────────────────────────────────────────
  # Stage 2: T1 CLI smoke (newman vs Postman collection)
  # ─────────────────────────────────────────────────────────────────

  t1-smoke-preview:
    name: T1 — newman smoke (Preview)
    needs: [build, change-detector]
    # Skip when no API-affecting paths changed (src/app/api/**,
    # src/lib/**, mabl/postman/**). Skipped jobs report success to
    # branch protection (TAMD-132).
    #
    # TAMD-136: allow build.result == 'skipped' so this doesn't cascade-
    # skip on Dependabot dep bumps. Newman needs a Preview deploy URL,
    # which Vercel provides regardless of whether the local build job ran.
    if: |
      !cancelled() &&
      needs.build.result != 'failure' &&
      github.event_name == 'pull_request' &&
      needs.change-detector.outputs.has_api_changes == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: wait for Vercel Preview deployment + capture URL
        id: preview
        run: |
          repo="${GITHUB_REPOSITORY}"
          sha="${{ github.event.pull_request.head.sha }}"
          echo "Waiting for Vercel Preview deployment on sha $sha ..."
          for i in $(seq 1 60); do
            url=$(gh api "repos/$repo/deployments?sha=$sha" \
              --jq 'map(select(.environment=="Preview")) | .[0].statuses_url' 2>/dev/null)
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              env_url=$(gh api "$url" \
                --jq '[.[] | select(.state=="success")] | .[0].environment_url' 2>/dev/null)
              if [ -n "$env_url" ] && [ "$env_url" != "null" ]; then
                if curl -fsS -m 5 "$env_url/api/health" >/dev/null 2>&1; then
                  echo "Preview ready: $env_url"
                  echo "url=$env_url" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "Vercel Preview never posted a success status for $sha" >&2
          exit 1
      - name: run newman T1 smoke
        id: newman
        run: |
          url="${{ steps.preview.outputs.url }}/api"
          npx --yes newman run mabl/postman/csh-api-smoke.postman_collection.json \
            --env-var "baseUrl=$url" \
            --reporters cli,json \
            --reporter-json-export newman-results.json \
            --color on \
            --timeout-request 10000

  t1-smoke-prod:
    name: T1 — newman smoke (Prod)
    needs: [build, change-detector]
    # Skip when no API-affecting paths changed. Post-deploy gate, so
    # only fires on main pushes. (TAMD-132)
    # TAMD-136: tolerate build.result == 'skipped' (Dependabot bumps).
    if: |
      !cancelled() &&
      needs.build.result != 'failure' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.change-detector.outputs.has_api_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: wait for Vercel Prod to reflect new commit
        run: |
          short="${GITHUB_SHA:0:7}"
          for i in $(seq 1 30); do
            live=$(curl -fsS "${{ env.PRODUCTION_URL }}/api/build-info" | jq -r '.commit' | cut -c1-7)
            echo "live=$live expected=$short"
            [ "$live" = "$short" ] && exit 0
            sleep 10
          done
          echo "Prod never reflected new commit" >&2
          exit 1
      - name: run newman T1 smoke
        id: newman
        run: |
          npx --yes newman run mabl/postman/csh-api-smoke.postman_collection.json \
            --env-var "baseUrl=${{ env.PRODUCTION_URL }}/api" \
            --reporters cli,json \
            --reporter-json-export newman-results.json \
            --color on \
            --timeout-request 10000

  # ─────────────────────────────────────────────────────────────────
  # Stage 3: mabl cloud gate — gated on T1 newman green
  # ─────────────────────────────────────────────────────────────────

  mabl-smoke:
    name: mabl — CSH-SMOKE-PR (Preview)
    needs: [t1-smoke-preview, change-detector]
    # Skip when no app-affecting paths changed. mabl smoke tests
    # exercise the Preview deploy — no point firing when the deploy
    # itself wasn't rebuilt. (TAMD-132) — saves mabl cloud minutes.
    # TAMD-136: tolerate t1-smoke-preview.result == 'skipped' (Dependabot
    # bumps don't touch API surface so newman has nothing to assert against
    # — but the Preview deploy still happens via Vercel, and a dep bump
    # could break the UI, so the smoke test is still meaningful).
    if: |
      !cancelled() &&
      needs.t1-smoke-preview.result != 'failure' &&
      github.event_name == 'pull_request' &&
      needs.change-detector.outputs.has_app_changes == 'true'
    runs-on: ubuntu-latest
    env:
      MABL_API_TOKEN: ${{ secrets.MABL_API_TOKEN }}
      MABL_WORKSPACE_ID: ${{ secrets.MABL_WORKSPACE_ID }}
      MABL_APPLICATION_ID: ${{ secrets.MABL_APPLICATION_ID }}
      MABL_ENV_PREVIEW_ID: ${{ secrets.MABL_ENV_PREVIEW_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: check MABL_CLOUD_GATE toggle
        id: gate
        run: |
          toggle="${{ vars.MABL_CLOUD_GATE || 'enabled' }}"
          echo "value=$toggle" >> "$GITHUB_OUTPUT"
          if [ "$toggle" = "disabled" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::mabl cloud gate is disabled (repo var MABL_CLOUD_GATE=disabled). Skipping cloud run."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skipped != 'true'
      - run: sudo apt-get update && sudo apt-get install -y jq
        if: steps.gate.outputs.skipped != 'true'
      - name: lookup Vercel preview URL from GitHub Deployments
        if: steps.gate.outputs.skipped != 'true'
        id: preview
        run: |
          repo="${GITHUB_REPOSITORY}"
          sha="${{ github.event.pull_request.head.sha }}"
          status_url=$(gh api "repos/$repo/deployments?sha=$sha" \
            --jq 'map(select(.environment=="Preview")) | .[0].statuses_url')
          env_url=$(gh api "$status_url" \
            --jq '[.[] | select(.state=="success")] | .[0].environment_url')
          echo "url=$env_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $env_url"
      - name: trigger CSH-SMOKE-PR against Preview
        if: steps.gate.outputs.skipped != 'true'
        run: |
          chmod +x scripts/mabl-deployment.sh
          ./scripts/mabl-deployment.sh \
            --environment "$MABL_ENV_PREVIEW_ID" \
            --application "$MABL_APPLICATION_ID" \
            --labels type-smk,exec-pr \
            --url "${{ steps.preview.outputs.url }}" \
            --commit "${{ github.sha }}" \
            --branch "${{ github.head_ref }}" \
            --wait
      # Note: mabl's native Slack integration (mabl Slack app, installed
      # in the workspace) posts the plan-run results directly to Slack
      # with screenshots, assertion details, and direct links to the
      # plan run in app.mabl.com. Our ci-notify.sh here only posts the
      # merge-gate decision (branch protection unblocked / blocked) so
      # we don't duplicate what mabl's Slack app already covers.
      - name: notify (success — merge unblocked)
        if: success() && steps.gate.outputs.skipped != 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          NEXT_GATE: "Merge allowed — branch protection unblocked. Merging triggers Prod deploy + T3."
        run: |
          bash scripts/ci-notify.sh ok "Merge-ready" "All required PR checks are green — merge button is live. mabl Slack app posted the plan-run result separately with screenshots + assertion details."
      - name: notify (failure — merge blocked)
        if: failure() && steps.gate.outputs.skipped != 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          bash scripts/ci-notify.sh fail "Merge blocked by mabl" "Browser-layer tests failed on the Preview deploy. See mabl's Slack post in this channel for screenshots + which steps failed, and the plan run for the full detail."
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skipped == 'true'
      - name: notify (cloud gate disabled — paused)
        if: steps.gate.outputs.skipped == 'true'
        env:
          NEXT_GATE: "Merge allowed — branch protection unblocked. Merging triggers Prod deploy + T3."
        run: |
          bash scripts/ci-notify.sh ok "Merge-ready" ":pause_button: mabl cloud gate paused for this PR (Newman + GHA gates were the verification surface)."

  post-deploy-smoke:
    name: mabl — CSH-SMOKE-POSTDEPLOY (Prod)
    needs: [t1-smoke-prod, change-detector]
    # Skip when no app-affecting paths changed — same reasoning as
    # mabl-smoke. Saves mabl cloud minutes on docs-only main merges.
    # (TAMD-132)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.change-detector.outputs.has_app_changes == 'true'
    runs-on: ubuntu-latest
    env:
      MABL_API_TOKEN: ${{ secrets.MABL_API_TOKEN }}
      MABL_APPLICATION_ID: ${{ secrets.MABL_APPLICATION_ID }}
      MABL_ENV_PROD_ID: ${{ secrets.MABL_ENV_PROD_ID }}
    steps:
      - name: check MABL_CLOUD_GATE toggle
        id: gate
        run: |
          toggle="${{ vars.MABL_CLOUD_GATE || 'enabled' }}"
          echo "value=$toggle" >> "$GITHUB_OUTPUT"
          if [ "$toggle" = "disabled" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::mabl cloud gate is disabled (repo var MABL_CLOUD_GATE=disabled). Skipping cloud run."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y jq
        if: steps.gate.outputs.skipped != 'true'
      - name: trigger CSH-SMOKE-POSTDEPLOY against Prod
        if: steps.gate.outputs.skipped != 'true'
        run: |
          chmod +x scripts/mabl-deployment.sh
          ./scripts/mabl-deployment.sh \
            --environment "$MABL_ENV_PROD_ID" \
            --application "$MABL_APPLICATION_ID" \
            --labels type-smk,exec-postdeploy \
            --url "${{ env.PRODUCTION_URL }}" \
            --commit "${{ github.sha }}" \
            --branch main \
            --wait
      # Same pattern as mabl-smoke: mabl's native Slack app posts the
      # plan-run result with full detail. Our notifier here handles the
      # "shipped / not shipped" ticket transition + summary.
      - name: notify (success — shipped, mabl ran)
        if: success() && steps.gate.outputs.skipped != 'true'
        env:
          JIRA_TRANSITION: Done
          PROD_URL: ${{ env.PRODUCTION_URL }}
          NEXT_GATE: "Live. Ticket moved to Done."
        run: |
          bash scripts/ci-notify.sh ok "Shipped to production" ":rocket: Change is live on ${{ env.PRODUCTION_URL }} and verified by mabl against real prod (see mabl's Slack post above for per-test detail). Ticket transitioning to Done."
      - name: notify (success — shipped, mabl gate paused)
        if: success() && steps.gate.outputs.skipped == 'true'
        env:
          JIRA_TRANSITION: Done
          PROD_URL: ${{ env.PRODUCTION_URL }}
          NEXT_GATE: "Live. Ticket moved to Done. (mabl cloud gate paused — verified by T1 newman + GHA gates only.)"
        run: |
          bash scripts/ci-notify.sh ok "Shipped to production" ":rocket: Change is live on ${{ env.PRODUCTION_URL }}. :pause_button: mabl cloud gate paused (Newman + GHA gates verified). Ticket transitioning to Done."
      - name: notify (failure)
        if: failure() && steps.gate.outputs.skipped != 'true'
        env:
          PROD_URL: ${{ env.PRODUCTION_URL }}
        run: |
          bash scripts/ci-notify.sh fail "Prod post-deploy failed" ":warning: Prod smoke failed after Vercel reflected the new commit. Prod may be broken right now. See mabl's Slack post for per-test failure detail and act."

      # Cost + cycle-time receipt — runs after the shipped notify.
      # Computes lead time (PR open → merged) and total GHA minutes via
      # gh api. Posts a final ":receipt:" message via ci-notify.sh.
      # Strictly deterministic; no LLM calls, no extra creds.
      - name: post cost + cycle-time receipt
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MABL_CLOUD_GATE: ${{ vars.MABL_CLOUD_GATE || 'enabled' }}
        run: |
          bash scripts/cycle-time-receipt.sh

  # ─────────────────────────────────────────────────────────────────
  # Test impact analysis — runs parallel with T1 smoke, PR only.
  # Advisory: posts a PR comment with coverage delta + relevant mabl
  # tests. Never blocks the merge gate on its own.
  # ─────────────────────────────────────────────────────────────────

  test-impact:
    name: test impact analysis
    needs: [unit, build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      MABL_API_TOKEN: ${{ secrets.MABL_API_TOKEN }}
      MABL_WORKSPACE_ID: ${{ secrets.MABL_WORKSPACE_ID }}
      MABL_APPLICATION_ID: ${{ secrets.MABL_APPLICATION_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: get changed files
        id: diff
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base_sha" "$head_sha")
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: query mabl for relevant tests
        id: mabl_tests
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.changed }}
        run: |
          chmod +x scripts/mabl-suggest-tests.sh
          suggestions=$(echo "$CHANGED_FILES" | ./scripts/mabl-suggest-tests.sh 2>/dev/null || true)
          echo "suggestions<<EOF" >> "$GITHUB_OUTPUT"
          echo "$suggestions" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: post PR comment
        env:
          COV_LINES: ${{ needs.unit.outputs.coverage_lines }}
          COV_BRANCHES: ${{ needs.unit.outputs.coverage_branches }}
          TEST_TOTAL: ${{ needs.unit.outputs.test_total }}
          TEST_PASSED: ${{ needs.unit.outputs.test_passed }}
          CHANGED_FILES: ${{ steps.diff.outputs.changed }}
          SUGGESTIONS: ${{ steps.mabl_tests.outputs.suggestions }}
        run: |
          if awk "BEGIN{exit !(${COV_LINES:-0} >= 90 && ${COV_BRANCHES:-0} >= 90)}"; then
            cov_icon="✅"; cov_note="above 90% threshold"
          else
            cov_icon="⚠️"; cov_note="**below 90% threshold — unit job blocks merge**"
          fi

          if [[ -z "${SUGGESTIONS:-}" || "$SUGGESTIONS" == *"No existing"* ]]; then
            mabl_section="No existing mabl tests matched the changed files.
          If this PR introduces new UI flows or API behaviour, create mabl tests before closing the ticket (see TAMD-88 for the process)."
          else
            mabl_section="$SUGGESTIONS"
          fi

          {
            echo "<!-- test-impact-analysis -->"
            echo "### 🔬 Test impact analysis"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Unit coverage — lines | ${cov_icon} \`${COV_LINES}%\` |"
            echo "| Unit coverage — branches | ${cov_icon} \`${COV_BRANCHES}%\` (${cov_note}) |"
            echo "| Unit tests | ${TEST_PASSED}/${TEST_TOTAL} passed |"
            echo "| Files changed | $(echo "$CHANGED_FILES" | wc -l | tr -d ' ') |"
            echo ""
            echo "**Changed files:**"
            echo "\`\`\`"
            echo "$CHANGED_FILES"
            echo "\`\`\`"
            echo ""
            echo "**Relevant mabl tests:**"
            echo "$mabl_section"
            echo ""
            echo "---"
            echo "_Run \`npm run test:mabl:local\` to run the mabl API gate locally. UI tests run in mabl cloud against the Preview deploy._"
          } | gh pr comment "${{ github.event.pull_request.number }}" --body-file -

  # NOTE: PR-time tier-4 area regression was removed in
  # chore/collapse-tier4-matrix. The mabl smoke (CSH-SMOKE-PR Preview)
  # covers UI smoke on every PR with app changes, and the nightly
  # workflow (.github/workflows/mabl-nightly.yml) runs the full
  # `type-rt` suite against Prod via CLI for drift detection.
