name: Claude — agentic definition of done

# Fires automatically on every PR open or push. Analysis-only — no code
# edits, no Jira creation, no mabl test creation. The agent inspects the
# diff, runs coverage, lists gaps, and posts a PR comment. Humans handle
# remediation.
#
# DEFENSE IN DEPTH:
#   1. Same-repo PRs only (no fork heads).
#   2. Tool surface: Read/Grep/Glob + tightly scoped Bash patterns +
#      read-only mabl/atlassian. No Edit, Write, or *create* tools.
#   3. Model and action SHA are pinned.
#
# Required secrets (same as claude.yml):
#   CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY
#   MABL_API_TOKEN, JIRA_USER_EMAIL, JIRA_API_TOKEN

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  CLAUDE_ACTION_SHA: 23e4ee05df2c5aefd801f51b83c81cd4215be7e9  # v1.0.120
  CLAUDE_MODEL: claude-opus-4-7
  DOD_ANALYSIS_TOOLS: "Read,Glob,Grep,Bash(npm run test:coverage),Bash(npm run lint),Bash(git diff *),Bash(git log *),Bash(node scripts/shift-left/audit.mjs *),mcp__mabl__get_mabl_tests,mcp__mabl__get_mabl_test_details,mcp__mabl__get_environments,mcp__mabl__get_applications,mcp__atlassian__read_jira_issue,mcp__atlassian__search_jira_issues"

jobs:
  claude-dod:
    name: Claude — definition of done
    # Same-repo PRs only. Fork PRs do not have secrets and could plant
    # adversarial files; skip them entirely.
    #
    # TAMD-137: also skip Dependabot PRs. Dependabot uses a separate
    # secrets bucket that doesn't have CLAUDE_CODE_OAUTH_TOKEN, and the
    # value DoD adds on a dep bump is marginal — `build (next)`, `lint`,
    # and `mabl — CSH-SMOKE-PR (Preview)` already cover what a dep bump
    # can break. Asking an LLM to "look for missing mabl test coverage"
    # against a package-lock.json diff is mostly theater. The path-
    # awareness fix in TAMD-136 makes those concrete gates actually
    # run on Dependabot PRs, which is what matters.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Write MCP config
        run: |
          mkdir -p .runtime
          cat > .runtime/mcp.json <<'EOF'
          {
            "mcpServers": {
              "mabl": {
                "type": "http",
                "url": "https://mcp.mabl.com/mcp",
                "headers": {
                  "x-api-key": "${MABL_MCP_API_KEY}"
                }
              },
              "atlassian": {
                "command": "npx",
                "args": ["--yes", "mcp-atlassian", "--transport", "stdio"],
                "env": {
                  "JIRA_URL": "https://mabl.atlassian.net",
                  "JIRA_USERNAME": "${JIRA_USER_EMAIL}",
                  "JIRA_API_TOKEN": "${JIRA_API_TOKEN}"
                }
              }
            }
          }
          EOF

      - name: Run Claude definition-of-done check
        id: claude
        uses: anthropics/claude-code-action@23e4ee05df2c5aefd801f51b83c81cd4215be7e9  # v1.0.120
        env:
          MABL_API_TOKEN: ${{ secrets.MABL_API_TOKEN }}
          # Dedicated workspace-scoped (pXXgThbNi4HfQOpiZptHfw-w) mabl API key for
          # the cloud MCP x-api-key. TAMD-179: MABL_API_TOKEN authenticates but
          # 403s on workspace read, so the MCP uses this Editor key instead.
          MABL_MCP_API_KEY: ${{ secrets.MABL_MCP_API_KEY }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # TAMD-137: `allowed_bots` (added in TAMD-136) is no longer
          # needed — the job-level `if:` skips Dependabot entirely. The
          # only way to re-enable DoD on Dependabot PRs would be to add
          # CLAUDE_CODE_OAUTH_TOKEN to the Dependabot secrets bucket and
          # remove the bot skip.
          # NOTE: intentionally NOT passing `settings: ".claude/settings.json"`.
          # See claude.yml for rationale.
          claude_args: >-
            --model ${{ env.CLAUDE_MODEL }}
            --mcp-config .runtime/mcp.json
            --allowed-tools "${{ env.DOD_ANALYSIS_TOOLS }}"
          prompt: |
            You are running as part of the CI pipeline for the cheap-shot-hockey repo,
            in ANALYSIS-ONLY mode. You may not write files, edit code, create Jira
            issues, or create mabl tests. Your tools are intentionally read-only +
            scoped Bash. If you find a gap, list it in the PR comment for a human to
            address — do not try to fix it yourself.

            Steps:

            1. Run `npm run test:coverage` and capture the output. Note any metric
               below 90%. (The vitest gate already blocks merge below 90% — your
               role is to call out which files are under-covered.)

            2. Run `git diff --name-only origin/main HEAD` to get changed files.
               Pipe that list through `node scripts/shift-left/audit.mjs impact -`
               to find which mabl tests this change impacts. This is the SAME
               area-coverage engine the `test-impact` CI job uses — precise tests
               (by changed data-testid), area-level tests (by impacted domain), and
               a CORE/BROAD flag for cross-cutting changes. Your summary MUST agree
               with that comment; report the engine's `▶ Recommendation` line.
               Then run `node scripts/shift-left/audit.mjs --guard` and note any
               unclassified surface it flags (advisory — a new area/manifest gap).

            3. Use `mcp__mabl__get_mabl_tests` (workspace_id pXXgThbNi4HfQOpiZptHfw-w,
               application_id OZqmshBkUfVSesWy49g1eQ-a) to identify new UI pages,
               components, or API routes that have NO existing mabl test coverage.
               List the gaps — do NOT create tests or open tickets.

            4. Post a single PR comment summarising:
               - Coverage result (pass/fail, metrics, under-covered files)
               - Impacted mabl tests from the engine: the `▶ Recommendation`
                 line, the impacted areas (+ CORE/BROAD if flagged), and the
                 precise vs area-level test lists
               - Coverage gaps: new flows with no mabl test (recommend, don't act);
                 cross-check against any unclassified surface the guard flagged
               - Existing Jira tickets that may relate (read-only mcp__atlassian__search)
               - Overall DoD status: PASS, OBSERVATIONS, or GAPS

            Be concise. One comment, not multiple. If everything is green and no gaps
            exist, say so plainly.
